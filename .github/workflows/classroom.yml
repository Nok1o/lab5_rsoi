name: GitHub Classroom Workflow

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Bootstrap only: OAuth API tests and cloud deployment will be connected after
# authorization is implemented and an Identity Provider is selected/configured.
# Do not run Lab 4 tests in place of the Lab 5 Classroom collection.
jobs:
  check:
    name: Build, unit tests and Helm checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v4.3.1
      - name: Check the migrated baseline without accessing the cloud
        run: bash scripts/check.sh
